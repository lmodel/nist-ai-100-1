# Where NIST's OSCAL catalog words a statement differently from Tables 1 to 4 of the
# publication. tests/test_catalogue.py holds the difference to this list.
GOVERN 1:
  catalog: Policies, processes, procedures and practices across the organization related to the mapping,
    measuring and managing of AI risks are in place, transparent, and implemented effectively.
  publication: Policies, processes, procedures, and practices across the organization related to the mapping,
    measuring, and managing of AI risks are in place, transparent, and implemented effectively.
GOVERN 1.2:
  catalog: The characteristics of trustworthy AI are integrated into organizational policies, processes,
    and procedures.
  publication: The characteristics of trustworthy AI are integrated into organizational policies, processes,
    procedures, and practices.
GOVERN 1.3:
  catalog: Processes and procedures are in place to determine the needed level of risk management activities
    based on the organization's risk tolerance.
  publication: Processes, procedures, and practices are in place to determine the needed level of risk
    management activities based on the organization’s risk tolerance.
GOVERN 1.5:
  catalog: Ongoing monitoring and periodic review of the risk management process and its outcomes are
    planned, organizational roles and responsibilities are clearly defined, including determining the
    frequency of periodic review.
  publication: Ongoing monitoring and periodic review of the risk management process and its outcomes
    are planned and organizational roles and responsibilities clearly defined, including determining the
    frequency of periodic review.
GOVERN 1.7:
  catalog: Processes and procedures are in place for decommissioning and phasing out of AI systems safely
    and in a manner that does not increase risks or decrease the organization’s trustworthiness.
  publication: Processes and procedures are in place for decommissioning and phasing out AI systems safely
    and in a manner that does not increase risks or decrease the organization’s trustworthiness.
GOVERN 3.1:
  catalog: Decision-makings related to mapping, measuring, and managing AI risks throughout the lifecycle
    is informed by a diverse team (e.g., diversity of demographics, disciplines, experience, expertise,
    and backgrounds).
  publication: Decision-making related to mapping, measuring, and managing AI risks throughout the lifecycle
    is informed by a diverse team (e.g., diversity of demographics, disciplines, experience, expertise,
    and backgrounds).
GOVERN 4.1:
  catalog: Organizational policies, and practices are in place to foster a critical thinking and safety-first
    mindset in the design, development, deployment, and uses of AI systems to minimize negative impacts.
  publication: Organizational policies and practices are in place to foster a critical thinking and safety-first
    mindset in the design, development, deployment, and uses of AI systems to minimize potential negative
    impacts.
GOVERN 4.2:
  catalog: Organizational teams document the risks and potential impacts of the AI technology they design,
    develop, deploy, evaluate and use, and communicate about the impacts more broadly.
  publication: Organizational teams document the risks and potential impacts of the AI technology they
    design, develop, deploy, evaluate, and use, and they communicate about the impacts more broadly.
GOVERN 5.2:
  catalog: Mechanisms are established to enable AI actors to regularly incorporate adjudicated feedback
    from relevant AI actors into system design and implementation.
  publication: Mechanisms are established to enable the team that developed or deployed AI systems to
    regularly incorporate adjudicated feedback from relevant AI actors into system design and implementation.
GOVERN 6.1:
  catalog: Policies and procedures are in place that address AI risks associated with third-party entities,
    including risks of infringement of a third party's intellectual property or other rights.
  publication: Policies and procedures are in place that address AI risks associated with third-party
    entities, including risks of infringement of a third-party’s intellectual property or other rights.
MANAGE 1:
  catalog: AI risks based on assessments and other analytical output from the Map and measure functions
    are prioritized, responded to, and managed.
  publication: AI risks based on assessments and other analytical output from the MAP and MEASURE functions
    are prioritized, responded to, and managed.
MANAGE 1.1:
  catalog: A determination is made as to whether the AI system achieves its intended purpose and stated
    objectives and whether its development or deployment should proceed.
  publication: A determination is made as to whether the AI system achieves its intended purposes and
    stated objectives and whether its development or deployment should proceed.
MANAGE 1.2:
  catalog: Treatment of documented AI risks is prioritized based on impact, likelihood, or available resources
    or methods.
  publication: Treatment of documented AI risks is prioritized based on impact, likelihood, and available
    resources or methods.
MANAGE 1.3:
  catalog: Responses to the AI risks deemed high priority as identified by the Map function, are developed,
    planned, and documented. Risk response options can include mitigating, transferring, avoiding, or
    accepting.
  publication: Responses to the AI risks deemed high priority, as identified by the MAP function, are
    developed, planned, and documented. Risk response options can include mitigating, transferring, avoiding,
    or accepting.
MANAGE 2:
  catalog: Strategies to maximize AI benefits and minimize negative impacts are planned, prepared, implemented,
    and documented, and informed by input from relevant AI actors.
  publication: Strategies to maximize AI benefits and minimize negative impacts are planned, prepared,
    implemented, documented, and informed by input from relevant AI actors.
MANAGE 2.1:
  catalog: Resources required to manage AI risks are taken into account, along with viable non-AI alternative
    systems, approaches, or methods – to reduce the magnitude or likelihood of potential impacts.
  publication: Resources required to manage AI risks are taken into account – along with viable non-AI
    alternative systems, approaches, or methods – to reduce the magnitude or likelihood of potential impacts.
MANAGE 2.4:
  catalog: Mechanisms are in place and applied, responsibilities are assigned and understood to supersede,
    disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended
    use.
  publication: Mechanisms are in place and applied, and responsibilities are assigned and understood,
    to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent
    with intended use.
MANAGE 4:
  catalog: Risk treatments including response and recovery, and communication plans to the identified
    and measured AI risks are documented and monitored regularly.
  publication: Risk treatments, including response and recovery, and communication plans for the identified
    and measured AI risks are documented and monitored regularly.
MANAGE 4.3:
  catalog: Incidents and errors are communicated to relevant AI actors including affected communities.
    Processes for tracking, responding to, and recovering from incidents and errors are followed and documented.
  publication: Incidents and errors are communicated to relevant AI actors, including affected communities.
    Processes for tracking, responding to, and recovering from incidents and errors are followed and documented.
MAP 1.1:
  catalog: 'Intended purpose, potentially beneficial uses, context-specific laws, norms and expectations,
    and prospective settings in which the AI system will be deployed are understood and documented. Considerations
    include: specific set or types of users along with their expectations; potential positive and negative
    impacts of system uses to individuals, communities, organizations, society, and the planet; assumptions
    and related limitations about AI system purposes; uses and risks across the development or product
    AI lifecycle; TEVV and system metrics.'
  publication: 'Intended purposes, potentially beneficial uses, context-specific laws, norms and expectations,
    and prospective settings in which the AI system will be deployed are understood and documented. Considerations
    include: the specific set or types of users along with their expectations; potential positive and
    negative impacts of system uses to individuals, communities, organizations, society, and the planet;
    assumptions and related limitations about AI system purposes, uses, and risks across the development
    or product AI lifecycle; and related TEVV and system metrics.'
MAP 1.2:
  catalog: Inter-disciplinary AI actors, competencies, skills and capacities for establishing context
    reflect demographic diversity and broad domain and user experience expertise, and their participation
    is documented. Opportunities for interdisciplinary collaboration are prioritized.
  publication: Interdisciplinary AI actors, competencies, skills, and capacities for establishing context
    reflect demographic diversity and broad domain and user experience expertise, and their participation
    is documented. Opportunities for interdisciplinary collaboration are prioritized.
MAP 1.3:
  catalog: The organization’s mission and relevant goals for the AI technology are understood and documented.
  publication: The organization’s mission and relevant goals for AI technology are understood and documented.
MAP 1.4:
  catalog: The business value or context of business use has been clearly defined or– in the case of assessing
    existing AI systems – re-evaluated.
  publication: The business value or context of business use has been clearly defined or – in the case
    of assessing existing AI systems – re-evaluated.
MAP 2.1:
  catalog: The specific task, and methods used to implement the task, that the AI system will support
    is defined (e.g., classifiers, generative models, recommenders).
  publication: The specific tasks and methods used to implement the tasks that the AI system will support
    are defined (e.g., classifiers, generative models, recommenders).
MAP 2.2:
  catalog: Information about the AI system’s knowledge limits and how system output may be utilized and
    overseen by humans is documented. Documentation provides sufficient information to assist relevant
    AI actors when making informed decisions and taking subsequent actions.
  publication: Information about the AI system’s knowledge limits and how system output may be utilized
    and overseen by humans is documented. Documentation provides sufficient information to assist relevant
    AI actors when making decisions and taking subsequent actions.
MAP 2.3:
  catalog: Scientific integrity and TEVV considerations are identified and documented, including those
    related to experimental design, data collection and selection(e.g., availability, representativeness,
    suitability), system trustworthiness, and construct validation.
  publication: Scientific integrity and TEVV considerations are identified and documented, including those
    related to experimental design, data collection and selection (e.g., availability, representativeness,
    suitability), system trustworthiness, and construct validation.
MAP 3.2:
  catalog: Potential costs, including non-monetary costs, which result from expected or realized AI errors
    or system functionality and trustworthiness - as connected to organizational risk tolerance - are
    examined and documented.
  publication: Potential costs, including non-monetary costs, which result from expected or realized AI
    errors or system functionality and trustworthiness – as connected to organizational risk tolerance
    – are examined and documented.
MAP 3.3:
  catalog: Targeted application scope is specified and documented based on the system's capability, established
    context, and AI system categorization.
  publication: Targeted application scope is specified and documented based on the system’s capability,
    established context, and AI system categorization.
MAP 3.4:
  catalog: Processes for operator and practitioner proficiency with AI system performance and trustworthiness
    – and relevant technical standards and certifications – are defined, assessed and documented.
  publication: Processes for operator and practitioner proficiency with AI system performance and trustworthiness
    – and relevant technical standards and certifications – are defined, assessed, and documented.
MAP 3.5:
  catalog: Processes for human oversight are defined, assessed, and documented in accordance with organizational
    policies from GOVERN function.
  publication: Processes for human oversight are defined, assessed, and documented in accordance with
    organizational policies from the GOVERN function.
MAP 4.1:
  catalog: Approaches for mapping AI technology and legal risks of its components –including the use of
    third-party data or software – are in place, followed, and documented, as are risks of infringement
    of a third-party’s intellectual property or other rights.
  publication: Approaches for mapping AI technology and legal risks of its components – including the
    use of third-party data or software – are in place, followed, and documented, as are risks of infringement
    of a third party’s intellectual property or other rights.
MAP 4.2:
  catalog: Internal risk controls for components of the AI system including third-party AI technologies
    are identified and documented.
  publication: Internal risk controls for components of the AI system, including third-party AI technologies,
    are identified and documented.
MEASURE 1.1:
  catalog: Approaches and metrics for measurement of AI risks enumerated during the Map function are selected
    for implementation starting with the most significant AI risks. The risks or trustworthiness characteristics
    that will not –or cannot – be measured are properly documented.
  publication: Approaches and metrics for measurement of AI risks enumerated during the MAP function are
    selected for implementation starting with the most significant AI risks. The risks or trustworthiness
    characteristics that will not – or cannot – be measured are properly documented.
MEASURE 1.2:
  catalog: Appropriateness of AI metrics and effectiveness of existing controls is regularly assessed
    and updated including reports of errors and impacts on affected communities.
  publication: Appropriateness of AI metrics and effectiveness of existing controls are regularly assessed
    and updated, including reports of errors and potential impacts on affected communities.
MEASURE 2.1:
  catalog: Test sets, metrics, and details about the tools used during test, evaluation, validation, and
    verification (TEVV) are documented.
  publication: Test sets, metrics, and details about the tools used during TEVV are documented.
MEASURE 2.2:
  catalog: Evaluations involving human subjects meet applicable requirements(including human subject protection)
    and are representative of the relevant population.
  publication: Evaluations involving human subjects meet applicable requirements (including human subject
    protection) and are representative of the relevant population.
MEASURE 2.3:
  catalog: AI system performance or assurance criteria are measured qualitatively or quantitatively and
    demonstrated for conditions similar to deployment setting(s). measures are documented.
  publication: AI system performance or assurance criteria are measured qualitatively or quantitatively
    and demonstrated for conditions similar to deployment setting(s). Measures are documented.
MEASURE 2.6:
  catalog: AI system is evaluated regularly for safety risks – as identified in the MAP function. The
    AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed the
    risk tolerance, and can fail safely, particularly if made to operate beyond its knowledge limits.
    Safety metrics implicate system reliability and robustness, real-time monitoring, and response times
    for AI system failures.
  publication: The AI system is evaluated regularly for safety risks – as identified in the MAP function.
    The AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed
    the risk tolerance, and it can fail safely, particularly if made to operate beyond its knowledge limits.
    Safety metrics reflect system reliability and robustness, real-time monitoring, and response times
    for AI system failures.
MEASURE 2.9:
  catalog: The AI model is explained, validated, and documented, and an AI system output is interpreted
    within its context – as identified in the MAP function –and to inform responsible use and governance.
  publication: The AI model is explained, validated, and documented, and AI system output is interpreted
    within its context – as identified in the MAP function – to inform responsible use and governance.
MEASURE 2.11:
  catalog: Fairness and bias – as identified in the MAP function – is evaluated and results are documented.
  publication: Fairness and bias – as identified in the MAP function – are evaluated and results are documented.
MEASURE 2.13:
  catalog: Effectiveness of the employed TEVV metrics and processes in the measure function are evaluated
    and documented.
  publication: Effectiveness of the employed TEVV metrics and processes in the MEASURE function are evaluated
    and documented.
MEASURE 4.1:
  catalog: measurement approaches for identifying AI risks are connected to deployment context(s) and
    informed through consultation with domain experts and other end users. Approaches are documented.
  publication: Measurement approaches for identifying AI risks are connected to deployment context(s)
    and informed through consultation with domain experts and other end users. Approaches are documented.
MEASURE 4.2:
  catalog: measurement results regarding AI system trustworthiness in deployment context(s) and across
    AI lifecycle are informed by input from domain experts and other relevant AI actors to validate whether
    the system is performing consistently as intended. Results are documented.
  publication: Measurement results regarding AI system trustworthiness in deployment context(s) and across
    the AI lifecycle are informed by input from domain experts and relevant AI actors to validate whether
    the system is performing consistently as intended. Results are documented.
MEASURE 4.3:
  catalog: Measurable performance improvements or declines based on consultations with relevant AI actors
    including affected communities, and field data about context-relevant risks and trustworthiness characteristics,
    are identified and documented.
  publication: Measurable performance improvements or declines based on consultations with relevant AI
    actors, including affected communities, and field data about context-relevant risks and trustworthiness
    characteristics are identified and documented.
