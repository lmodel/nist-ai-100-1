  "description": "A LinkML model of the Artificial Intelligence Risk Management Framework (AI RMF 1.0), which NIST publishes as NIST AI 100-1: the Core's functions, categories and subcategories with their Playbook material, the framing of risk and harm, the trustworthiness characteristics, the lifecycle and AI actors, profiles and the lists of the appendices.",
  "title": "NIST AI Risk Management Framework (AI RMF 1.0)",
  "comments": [
    "The version is the AI RMF edition, and source is the publication's digital object identifier. NIST numbers the framework 1.0 and its catalog of it 1.0.0. The release tags are the schema's own versions, and scripts/check_upstream_release.py reports when NIST changes the publication, the catalog or the Playbook.",
    "The publication is a work of the United States Government. NOTICE says what it and the catalog allow. The schema's descriptions are this project's own words; NIST's text of the Core and the Playbook is in src/nist_ai_100_1/data/, built from upstream/."
  ],
  "source": "https://doi.org/10.6028/NIST.AI.100-1",
  "see_also": [
    "https://lmodel.github.io/nist-ai-100-1",
    "https://www.nist.gov/itl/ai-risk-management-framework",
    "https://airc.nist.gov/airmf-resources/playbook/",
    "https://github.com/usnistgov/oscal-content/tree/v1.6.0/nist.gov/AI100-1/ver1"
  ],
